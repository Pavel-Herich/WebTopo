<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17212b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>WebTopo</title>
<meta name="build" content="20261126-1207">
<style>
:root{--bg:#0f1720;--panel:#17212b;--panel2:#1e2a36;--line:#2a3846;--text:#e9eef2;--muted:#8fa0ae;--acc:#4fc3f7;--pri:#0288d1;--ok:#66bb6a;--warn:#ffb74d;--bad:#e57373;--leg:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.ico{width:42px;height:42px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center}
.ico:active{background:var(--panel2)}
#title{flex:1;min-width:0}
#svName{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#svStats{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:7px;max-width:46vw;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600}
.pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:10px;height:10px;border-radius:50%;background:#607d8b;flex:none}
.pill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.connecting .dot,.pill.wait .dot{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#stBar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#stChip{display:flex;align-items:center;gap:8px;border:1px solid #2f6d8f;background:#123047;border-radius:10px;padding:7px 12px;font-size:15px}
#stChip b{font-size:17px;color:#b3e5fc}
#stChip .arr{color:var(--muted)}
#stExt{font-weight:800;color:var(--warn);font-size:18px}
#stHint{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
#tblWrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th.st{text-align:left}
td{padding:10px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td.st{text-align:left;font-weight:600}
td.ex{color:var(--warn);font-weight:800;width:22px;text-align:center}
tr.splay td{color:var(--muted);font-weight:400}
tr.leg td{color:var(--leg)}
tr.leg td:nth-child(3),tr.leg td:nth-child(4),tr.leg td:nth-child(5){font-weight:600}
tr.cur td.st{color:#b3e5fc}
tr.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#2e7d32}100%{background:transparent}}
tr:active{background:var(--panel2)}
.cm{color:var(--warn);margin-left:4px;font-size:12px}
body[data-font=s] td{padding:7px 5px;font-size:13px}
body[data-font=l] td{padding:12px 6px;font-size:18px}
#empty{padding:28px 20px;color:var(--muted);text-align:center}
#empty .btn{margin:6px}
canvas{display:block;touch-action:none;background:#fbfaf5}
#tools{display:none;position:relative;z-index:5;gap:6px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);justify-content:space-between}
body.sketching #tools{display:flex}
.tb{flex:none;width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--text)}
.tb.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.tb.col i{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff4}
.tb.pen{position:relative}
.tb.pen span{position:absolute;right:4px;top:2px;font-size:10px;color:var(--muted)}
#palette{position:absolute;left:8px;bottom:100%;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #000a}
#palette[hidden]{display:none}
#stHint b{color:var(--text);font-weight:600}
#stHint small{font-size:11px}
#tabs{display:flex;gap:6px;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#tabs [data-v]{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;color:var(--muted)}
#tabs [data-v].on{background:var(--panel2);color:var(--text);border-color:#3b5163}
#btnShot{flex:1.2;height:44px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:700}
#btnShot:active{filter:brightness(1.2)}
#toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%,-12px);max-width:92vw;padding:10px 16px;border-radius:12px;background:#263238;color:#fff;font-weight:600;box-shadow:0 6px 24px #0008;opacity:0;pointer-events:none;transition:.2s;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#2e7d32}#toast.bad{background:#c62828}
.modal{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 8px);display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .16s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-h .ttl{flex:1;min-width:0}.sh-h b{display:block;font-size:16px}.sh-h small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.x{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px}
.sh-b{padding:12px 14px;overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.sh-h,.sh-f{flex:none}
.compact .sh-h{padding:9px 12px}.compact .sh-b{padding:8px 10px 12px}
.mgrid{display:grid;gap:6px}.mgrid.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.mgrid.r4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px}
.mbtn{min-height:44px;padding:5px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);line-height:1.15;text-align:center}
.mbtn b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.mbtn:disabled{opacity:.35}.mbtn:active{filter:brightness(1.25)}
.sh-b:empty{display:none}
.sh-f{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px;justify-content:flex-end}
.sh-f.vert{flex-direction:column}
.sh-f.vert .btn{width:100%;text-align:left}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:active{filter:brightness(1.25)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.bad{color:#ffcdd2;border-color:#6d2a2a;background:#3a1d1d}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
label{display:block;margin:8px 0;font-size:13px;color:var(--muted)}
label small{font-size:11px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0f1923;color:var(--text);font:16px system-ui,sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
label.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
label.check input{width:22px;height:22px;margin:0}
.radios{display:flex;flex-direction:column;gap:6px}
label.radio{display:flex;gap:10px;align-items:center;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px}
label.radio input{width:20px;height:20px;margin:0;flex:none}
label.radio small{display:block;color:var(--muted);font-size:12px}
label.radio.dis{opacity:.45}
.caps{display:flex;gap:8px;margin-bottom:6px;font-size:12px}
.caps span{padding:3px 8px;border-radius:6px;background:var(--panel2)}
.caps .y{color:var(--ok)}.caps .n{color:var(--bad)}
.state{margin:4px 0 10px;font-weight:600}
.note{font-size:13px;color:var(--warn);margin:8px 0}
.row{display:flex;flex-wrap:wrap}.gap{gap:6px;margin:8px 0}
.log{max-height:180px;overflow:auto;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#0b1118;padding:8px;border-radius:8px;white-space:pre-wrap;color:#b0bec5}
details summary{cursor:pointer;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:8px 12px;border-radius:16px;border:1px solid #2f6d8f;background:#123047;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.svrow,.exrow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.svrow.on{background:#123047;border-radius:8px}
.svrow .t,.exrow .t{flex:1;min-width:0}
.svrow small,.exrow small{display:block;color:var(--muted);font-size:12px}
.help p{margin:0 0 10px;font-size:14px}
</style>
</head>
<body data-font="m">
<div id="app">
  <header id="top">
    <button id="btnMenu" class="ico" aria-label="Menu"></button>
    <div id="title"><div id="svName">WebTopo</div><div id="svStats"></div></div>
    <button id="devPill" class="pill off"><span class="dot"></span><span id="devName">Pripojiť</span></button>
  </header>
  <div id="stBar">
    <button id="stChip">Od <b id="stCur">1.0</b><span class="arr">→</span><b id="stNext">1.1</b><span id="stExt">›</span></button>
    <div id="stHint">3 zhodné merania<br>= ťah</div>
  </div>
  <main>
    <section id="vData" class="view active">
      <div id="tblWrap">
        <table><thead><tr><th class="st">Od</th><th class="st">Do</th><th>Dĺžka</th><th>Azimut</th><th>Sklon</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
        <div id="empty"><p>Zatiaľ žiadne merania.</p><button class="btn pri" id="emptyDev">Pripojiť prístroj</button><button class="btn" id="emptyMan">Zadať ručne</button></div>
      </div>
    </section>
    <section id="vPlan" class="view"><canvas id="cvPlan"></canvas></section>
    <section id="vElev" class="view"><canvas id="cvElev"></canvas></section>
  </main>
  <div id="tools"></div>
  <nav id="tabs">
    <button data-v="vData" class="on">Dáta</button>
    <button data-v="vPlan">Pôdorys</button>
    <button data-v="vElev">Rez</button>
    <button id="btnShot">+ Ručne</button>
  </nav>
</div>
<div id="toast"></div>
<script>
/* WebTopo – jadro bez UI: protokoly prístrojov, merania, geometria, exporty/importy.
   Beží v prehliadači (window.WT) aj v Node (require) kvôli testom. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.WT = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const COLORS = ['black', 'gray', 'brown', 'blue', 'red', 'green', 'orange'];
  const XVI_K = 200 / 2.54; // jednotiek XVI/th2 na meter (78,74 – ako PocketTopo podklad v xtherione a PreTherione)
  const SCRAP_SCALE_M = 10;  // dĺžka mierky v hlavičke scrapu: 10 m = 787,402 jednotky

  const norm360 = a => ((a % 360) + 360) % 360;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad2 = n => (n < 10 ? '0' : '') + n;
  function isoDate(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fmt(v, n) {
    const f = Math.pow(10, n);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0; // bez "-0.00"
    return r.toFixed(n);
  }
  function fmtAz(a) { let s = fmt(norm360(a), 2); if (s === '360.00') s = '0.00'; return s; }

  // ============================== Prístroje ==============================
  const SPP_UUID = '00001101-0000-1000-8000-00805f9b34fb';
  const NUS_SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
  const UUID = {
    SPP: SPP_UUID, NUS_SVC, NUS_RX, NUS_TX,
    CC254X_SVC: '0000ffe0-0000-1000-8000-00805f9b34fb', CC254X_CHR: '0000ffe1-0000-1000-8000-00805f9b34fb',
    RN4870_SVC: '49535343-fe7d-4ae5-8fa9-9fafd205e455', RN4870_CHR: '49535343-1e4d-4bd9-ba61-23c647249616',
    SAP6_SVC: '137c4435-8a64-4bcb-93f1-3792c6bdc965', SAP6_CMD: '137c4435-8a64-4bcb-93f1-3792c6bdc967', SAP6_LEG: '137c4435-8a64-4bcb-93f1-3792c6bdc968',
    BRIC_MEAS: '000058d0-0000-1000-8000-00805f9b34fb', BRIC_PRIM: '000058d1-0000-1000-8000-00805f9b34fb',
    BRIC_META: '000058d2-0000-1000-8000-00805f9b34fb', BRIC_ERR: '000058d3-0000-1000-8000-00805f9b34fb',
    BRIC_CTRL: '000058e0-0000-1000-8000-00805f9b34fb', BRIC_CTRL_CHR: '000058e1-0000-1000-8000-00805f9b34fb'
  };
  const DISTOX_CMD = { laserOn: 0x36, laserOff: 0x37, shot: 0x38, off: 0x34, calibOn: 0x31, calibOff: 0x30, silentOn: 0x33, silentOff: 0x32 };
  const SAP6_CMD = { laserOn: 0x36, laserOff: 0x37, shot: 0x38, off: 0x34 };
  const BRIC_CMD = { shot: 'shot', laserOn: 'laser', laserOff: 'laser', off: 'power off' };

  // Potvrdenie paketu DistoX: 0x55 + sekvenčný bit prijatého paketu.
  const distoxAck = b0 => (b0 & 0x80) | 0x55;

  // 8-bajtový paket DistoX (DistoX2/X310, DistoX A3, SAP5, vnútri DistoX BLE).
  function decodeDistoX(p) {
    const t = p[0] & 0x3f;
    if (t === 0x01) {
      const raw = ((p[0] & 0x40) ? 0x10000 : 0) + (p[1] | (p[2] << 8));
      const d = raw <= 100000 ? raw / 1000 : 100 + (raw - 100000) / 100; // nad 100 m rozlíšenie cm (X310)
      const a = (p[3] | (p[4] << 8)) * 180 / 32768;
      const c = p[5] | (p[6] << 8);
      const i = (c >= 32768 ? c - 65536 : c) * 90 / 16384;
      return { type: 'shot', d, a: norm360(a), i, roll: p[7] * 180 / 128 };
    }
    if (t === 0x02 || t === 0x03) return { type: 'calib' };
    if (t === 0x04) return { type: 'vector', back: !!(p[0] & 0x40) };
    if (t === 0x38) return { type: 'reply' };
    return { type: 'unknown' };
  }

  // Prúd bajtov zo sériového spojenia → pakety po 8 bajtov, s potvrdením a odfiltrovaním opakovaní.
  class DistoXStream {
    constructor() { this.buf = []; this.last = null; }
    push(bytes) {
      const out = [];
      for (let k = 0; k < bytes.length; k++) this.buf.push(bytes[k] & 0xff);
      while (this.buf.length >= 8) {
        const t = this.buf[0] & 0x3f;
        if (t !== 1 && t !== 2 && t !== 3 && t !== 4 && t !== 0x38) { this.buf.shift(); continue; } // resynchronizácia
        const p = Uint8Array.from(this.buf.splice(0, 8));
        const dup = !!this.last && this.last.every((v, k) => v === p[k]);
        this.last = p;
        const msg = decodeDistoX(p);
        out.push({ p, msg, dup, ack: msg.type === 'reply' ? null : distoxAck(p[0]) });
      }
      return out;
    }
  }

  // DistoX BLE: zápis je rámcovaný "data:" + dĺžka + obsah + CRLF.
  function distoxBleFrame(bytes) {
    const out = new Uint8Array(8 + bytes.length);
    out.set([0x64, 0x61, 0x74, 0x61, 0x3a, bytes.length], 0);
    out.set(bytes, 6);
    out.set([0x0d, 0x0a], 6 + bytes.length);
    return out;
  }
  // Notifikácia DistoX BLE: [0x01 | 0x02][8 B paket][8 B vektor]
  function decodeDistoXBle(v) {
    if (v.length >= 9 && (v[0] === 0x01 || v[0] === 0x02)) {
      const p = v.slice(1, 9);
      return { kind: v[0] === 0x01 ? 'shot' : 'calib', p, msg: decodeDistoX(p), ack: distoxAck(p[0]) };
    }
    return { kind: 'other' };
  }
  // SAP6 / DiscoX (caveble): [seq u8][azimut f32][sklon f32][roll f32][dĺžka f32], little-endian; ACK = 0x55 + seq
  function decodeSap6(v) {
    if (v.length < 17) return null;
    const dv = new DataView(v.buffer, v.byteOffset, v.byteLength);
    const seq = v[0];
    return { seq, a: norm360(dv.getFloat32(1, true)), i: dv.getFloat32(5, true), roll: dv.getFloat32(9, true), d: dv.getFloat32(13, true), ack: 0x55 + (seq & 1) };
  }
  // BRIC4/BRIC5: tri charakteristiky v poradí – primárna (čas, dĺžka, azimut, sklon), metadáta (index), chyby.
  function decodeBricPrimary(v) {
    if (v.length < 20) return null;
    const dv = new DataView(v.buffer, v.byteOffset, v.byteLength);
    return { d: dv.getFloat32(8, true), a: norm360(dv.getFloat32(12, true)), i: dv.getFloat32(16, true),
      time: dv.getUint16(0, true) + '-' + pad2(v[2]) + '-' + pad2(v[3]) + ' ' + pad2(v[4]) + ':' + pad2(v[5]) + ':' + pad2(v[6]) };
  }
  function decodeBricMeta(v) {
    if (v.length < 4) return null;
    return { idx: new DataView(v.buffer, v.byteOffset, v.byteLength).getUint32(0, true) };
  }
  function decodeBricErr(v) { return { e1: v.length > 0 ? v[0] : 0, e2: v.length > 9 ? v[9] : 0 }; }
  const hex = u8 => Array.from(u8, b => (b < 16 ? '0' : '') + b.toString(16)).join(' ');

  // ============================== Prieskum ==============================
  function newSurvey(name) {
    const now = Date.now();
    return {
      v: 1, id: uid(), name: name || 'Prieskum', created: now, modified: now, date: isoDate(now),
      decl: 0, team: '', comment: '', fix: null,
      start: '1.0', cur: '1.0', next: '1.1', ext: 1,
      shots: [], sketch: { plan: [], elev: [] }, log: []
    };
  }
  function normalizeSurvey(s) {
    const n = newSurvey(s.name);
    const out = Object.assign(n, s);
    out.sketch = Object.assign({ plan: [], elev: [] }, s.sketch || {});
    out.shots = (s.shots || []).map(x => Object.assign({ id: uid(), from: '', to: '', d: 0, a: 0, i: 0, ext: 1, t: out.created, c: '' }, x));
    out.log = s.log || [];
    if (!out.next) out.next = suggestNext(out, out.cur);
    return out;
  }

  function stationNames(s) {
    const set = new Set();
    for (const sh of s.shots) { if (sh.from) set.add(sh.from); if (sh.to) set.add(sh.to); }
    return set;
  }
  function splitName(n) { const m = /^(.*?)(\d+)$/.exec(n); return m ? { pre: m[1], num: parseInt(m[2], 10), w: m[2].length } : null; }
  const padNum = (num, w) => { const t = String(num); return t.length >= w ? t : '0'.repeat(w - t.length) + t; };

  // Návrh názvu ďalšej stanice. Z poslednej stanice série pokračuje (1.3 → 1.4),
  // z inej stanice založí novú sériu (1.1 → 2.1), ak branch === 'series'.
  function suggestNext(s, cur, branch) {
    branch = branch || s.branch || 'series';
    cur = cur || s.cur || '1.0';
    const names = stationNames(s); names.add(cur);
    const p = splitName(cur);
    if (!p) { let k = 1; while (names.has(cur + k)) k++; return cur + k; }
    let max = -Infinity;
    for (const n of names) { const q = splitName(n); if (q && q.pre === p.pre) max = Math.max(max, q.num); }
    const nextIn = () => { let k = max + 1; while (names.has(p.pre + padNum(k, p.w))) k++; return p.pre + padNum(k, p.w); };
    if (p.num === max || branch !== 'series') return nextIn();
    const ms = /^(.*?)(\d+)\.$/.exec(p.pre);
    if (!ms) return nextIn();
    let maxS = -Infinity;
    for (const n of names) { const m = /^(.*?)(\d+)\.(\d+)$/.exec(n); if (m && m[1] === ms[1]) maxS = Math.max(maxS, +m[2]); }
    let sn = maxS + 1, cand = ms[1] + sn + '.1';
    while (names.has(cand)) { sn++; cand = ms[1] + sn + '.1'; }
    return cand;
  }
  function setCurrent(s, name) {
    s.cur = name;
    if (!s.shots.some(x => x.to)) s.start = name; // kým nie je ťah, aktuálna stanica je aj počiatok
    s.next = suggestNext(s, name);
  }

  function dirVec(a, i) { const ci = Math.cos(i * D2R); return [ci * Math.sin(a * D2R), ci * Math.cos(a * D2R), Math.sin(i * D2R)]; }
  function angleBetween(s1, s2) {
    const u = dirVec(s1.a, s1.i), v = dirVec(s2.a, s2.i);
    const dot = Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1] + u[2] * v[2]));
    return Math.acos(dot) * R2D;
  }
  const shotsClose = (s1, s2, tolD, tolA) => Math.abs(s1.d - s2.d) <= tolD && angleBetween(s1, s2) <= tolA;
  function averageShots(list) { // priemer smerových vektorov – funguje aj pri zvislých zámeroch a prechode cez sever
    let x = 0, y = 0, z = 0, d = 0;
    for (const s of list) { const u = dirVec(s.a, s.i); x += u[0]; y += u[1]; z += u[2]; d += s.d; }
    const n = Math.hypot(x, y, z) || 1;
    return { d: d / list.length, a: norm360(Math.atan2(x, y) * R2D), i: Math.asin(Math.max(-1, Math.min(1, z / n))) * R2D };
  }

  const DEFAULT_OPT = { tolD: 0.05, tolA: 1.7, legShots: 3 };

  // Nové meranie z prístroja: zapíše sa ako zámer z aktuálnej stanice; 3 zhodné po sebe = ťah.
  function addMeasurement(s, m, opt) {
    opt = Object.assign({}, DEFAULT_OPT, opt || {});
    const t = m.t || Date.now();
    s.log.push({ t, d: +fmt(m.d, 3), a: +fmt(m.a, 2), i: +fmt(m.i, 2), dev: m.dev || '' });
    s.modified = Date.now();
    const last = s.shots[s.shots.length - 1];
    // ďalšie opakovanie ťahu (napr. 4. meranie) sa pridá do priemeru ťahu, nie ako zámer
    if (last && last.to && last.raw && last.to === s.cur && t - last.t < 120000 &&
        shotsClose(last, m, opt.tolD, opt.tolA) && !m.manual) {
      last.raw.push([m.d, m.a, m.i]);
      Object.assign(last, averageShots(last.raw.map(r => ({ d: r[0], a: r[1], i: r[2] }))));
      last.t = t;
      return { kind: 'legplus', shot: last };
    }
    const shot = { id: uid(), from: s.cur, to: '', d: m.d, a: norm360(m.a), i: m.i, ext: s.ext, t, c: '' };
    if (m.manual) shot.manual = true;
    s.shots.push(shot);
    return detectLeg(s, opt) || { kind: 'splay', shot };
  }
  function detectLeg(s, opt) {
    const k = opt.legShots || 3, n = s.shots.length;
    if (k < 2 || n < k) return null;
    const grp = s.shots.slice(n - k);
    if (!grp.every(x => !x.to && x.from === s.cur && !x.manual)) return null;
    for (let a = 0; a < k; a++) for (let b = a + 1; b < k; b++) if (!shotsClose(grp[a], grp[b], opt.tolD, opt.tolA)) return null;
    const av = averageShots(grp);
    const to = s.next && s.next !== s.cur ? s.next : suggestNext(s, s.cur);
    const leg = { id: uid(), from: s.cur, to, d: av.d, a: av.a, i: av.i, ext: s.ext, t: grp[k - 1].t, c: '', raw: grp.map(x => [x.d, x.a, x.i]) };
    s.shots.splice(n - k, k, leg);
    setCurrent(s, to);
    return { kind: 'leg', shot: leg };
  }

  const findShot = (s, id) => s.shots.findIndex(x => x.id === id);
  const stationUsed = (s, name) => s.shots.some(x => x.from === name || x.to === name);

  function deleteShot(s, id) {
    const k = findShot(s, id); if (k < 0) return null;
    const [sh] = s.shots.splice(k, 1);
    if (sh.to && (s.cur === sh.to || s.cur === sh.from) && !stationUsed(s, s.cur)) setCurrent(s, s.cur === sh.to ? sh.from : sh.to);
    else s.next = suggestNext(s, s.cur);
    s.modified = Date.now();
    return sh;
  }
  function reverseShot(s, id) { // spätný zámer: prehodiť Od/Do, namerané hodnoty ostávajú
    const sh = s.shots[findShot(s, id)]; if (!sh || !sh.to) return;
    [sh.from, sh.to] = [sh.to, sh.from]; s.modified = Date.now();
  }
  function toggleExt(s, id) {
    const sh = s.shots[findShot(s, id)]; if (!sh) return;
    sh.ext = sh.ext >= 0 ? -1 : 1;
    const legs = s.shots.filter(x => x.to);
    if (legs.length && legs[legs.length - 1] === sh) s.ext = sh.ext;
    s.modified = Date.now();
  }
  function splitLeg(s, id) { // ťah späť na pôvodné zámery
    const k = findShot(s, id); const sh = s.shots[k];
    if (!sh || !sh.to || !sh.raw) return;
    const parts = sh.raw.map(r => ({ id: uid(), from: sh.from, to: '', d: r[0], a: r[1], i: r[2], ext: sh.ext, t: sh.t, c: '' }));
    s.shots.splice(k, 1, ...parts);
    if (s.cur === sh.to && !stationUsed(s, sh.to)) setCurrent(s, sh.from);
    s.modified = Date.now();
  }
  function makeLeg(s, id, to) { // zámer → ťah
    const sh = s.shots[findShot(s, id)]; if (!sh || sh.to) return;
    to = to || (sh.from === s.cur ? s.next : suggestNext(s, sh.from));
    sh.to = to;
    if (sh.from === s.cur) setCurrent(s, to); else s.next = suggestNext(s, s.cur);
    s.modified = Date.now();
  }
  function renameStation(s, from, to) {
    if (!from || !to || from === to) return 0;
    let n = 0;
    for (const sh of s.shots) { if (sh.from === from) { sh.from = to; n++; } if (sh.to === from) { sh.to = to; n++; } }
    for (const k of ['start', 'cur', 'next']) if (s[k] === from) s[k] = to;
    for (const p of ['plan', 'elev']) for (const st of s.sketch[p]) if (st.anc === from) st.anc = to;
    if (s.fix && s.fix.st === from) s.fix.st = to;
    s.modified = Date.now();
    return n;
  }

  // Ťah, ktorým sa k stanici prišlo od počiatku (strom výpočtu), a stanica, z ktorej.
  function incoming(s, name, geo) {
    geo = geo || compute(s);
    const P = geo.pos.get(name);
    if (!P || !P.via) return null;
    const leg = s.shots.find(x => x.id === P.via);
    return leg ? { leg, from: P.pn } : null;
  }
  // Smer v rozvinutom reze: ťah do stanice, pri all aj všetky ťahy za ňou (smerom od počiatku).
  function setExtend(s, name, dir, all) {
    const geo = compute(s), ids = new Set();
    const P = geo.pos.get(name);
    if (P && P.via) ids.add(P.via);
    if (all) {
      const kids = new Map();
      for (const [n, Q] of geo.pos) if (Q.pn != null) { if (!kids.has(Q.pn)) kids.set(Q.pn, []); kids.get(Q.pn).push(n); }
      const sub = new Set([name]), q = [name];
      while (q.length) { const n = q.shift(); for (const c of kids.get(n) || []) if (!sub.has(c)) { sub.add(c); q.push(c); } }
      for (const L of s.shots) if (L.to && sub.has(L.from) && sub.has(L.to)) ids.add(L.id);
    }
    dir = dir >= 0 ? 1 : -1;
    for (const L of s.shots) if (L.to && ids.has(L.id)) L.ext = dir;
    const legs = s.shots.filter(x => x.to);
    if (legs.length && ids.has(legs[legs.length - 1].id)) s.ext = dir;
    s.modified = Date.now();
    return ids.size;
  }

  function stats(s) {
    let legs = 0, splays = 0, len = 0;
    for (const sh of s.shots) { if (sh.to) { legs++; len += sh.d; } else splays++; }
    return { legs, splays, len };
  }

  // ============================== Geometria ==============================
  // Polohy staníc v pôdoryse (x = východ, y = sever, z) a v rozvinutom reze (ex = rozvinutá vzdialenosť).
  function compute(s) {
    const decl = +s.decl || 0;
    const legs = [], splays = [];
    for (const sh of s.shots) (sh.to ? legs : splays).push(sh);
    const adj = new Map();
    const link = (n, e) => { if (!adj.has(n)) adj.set(n, []); adj.get(n).push(e); };
    for (const L of legs) { link(L.from, { L, fwd: true }); link(L.to, { L, fwd: false }); }
    const vec = sh => {
      const h = sh.d * Math.cos(sh.i * D2R), az = (sh.a + decl) * D2R;
      return { h, dx: h * Math.sin(az), dy: h * Math.cos(az), dz: sh.d * Math.sin(sh.i * D2R) };
    };
    const pos = new Map();
    const starts = [s.start].concat(legs.map(L => L.from), splays.map(S => S.from));
    let comp = 0;
    for (const st of starts) {
      if (!st || pos.has(st)) continue;
      if (!adj.has(st) && !splays.some(S => S.from === st) && st !== s.start) continue;
      pos.set(st, { x: 0, y: 0, z: 0, ex: 0, comp });
      const q = [st];
      while (q.length) {
        const n = q.shift(), P = pos.get(n);
        for (const { L, fwd } of adj.get(n) || []) {
          const o = fwd ? L.to : L.from;
          if (pos.has(o)) continue;
          const v = vec(L), sg = fwd ? 1 : -1, e = L.ext >= 0 ? 1 : -1;
          pos.set(o, { x: P.x + sg * v.dx, y: P.y + sg * v.dy, z: P.z + sg * v.dz, ex: P.ex + sg * e * v.h, comp, pn: n, via: L.id });
          q.push(o);
        }
      }
      comp++;
    }
    const segs = [];
    for (const L of legs) {
      const A = pos.get(L.from), B = pos.get(L.to);
      if (A && B) segs.push({ kind: 'leg', id: L.id, from: L.from, to: L.to, p: [A.x, A.y, B.x, B.y], e: [A.ex, A.z, B.ex, B.z] });
    }
    for (const S of splays) {
      const A = pos.get(S.from); if (!A) continue;
      const v = vec(S);
      // v reze sa zámer premieta na najrovnobežnejší ťah na stanici (so znamienkom jeho extend)
      let best = null;
      for (const { L } of adj.get(S.from) || []) {
        if (L.d * Math.cos(L.i * D2R) < 0.05) continue;
        const c = Math.cos((S.a - L.a) * D2R);
        if (!best || Math.abs(c) > Math.abs(best.c)) best = { c, e: L.ext >= 0 ? 1 : -1 };
      }
      const dex = best ? best.e * v.h * best.c : (S.ext >= 0 ? 1 : -1) * v.h;
      segs.push({ kind: 'splay', id: S.id, from: S.from, p: [A.x, A.y, A.x + v.dx, A.y + v.dy], e: [A.ex, A.z, A.ex + dex, A.z + v.dz] });
    }
    return { pos, segs };
  }
  const projXY = (P, proj) => (proj === 'plan' ? [P.x, P.y] : [P.ex, P.z]);

  // Ťahy náčrtu sú ukotvené k najbližšej stanici – pri oprave dát sa posúvajú so stanicou.
  function makeStroke(abs, col, geo, proj, width) {
    let bx = 0, by = 0; const n = abs.length / 2;
    for (let k = 0; k < abs.length; k += 2) { bx += abs[k]; by += abs[k + 1]; }
    bx /= n; by /= n;
    let anc = null, best = Infinity, o = [0, 0];
    for (const [name, P] of geo.pos) {
      const q = projXY(P, proj), dd = (q[0] - bx) ** 2 + (q[1] - by) ** 2;
      if (dd < best) { best = dd; anc = name; o = q; }
    }
    const pts = abs.map((v, k) => +(v - o[k & 1]).toFixed(3));
    const st = { id: uid(), col, anc, o: [+o[0].toFixed(3), +o[1].toFixed(3)], pts };
    if (width) st.w = width;
    return st;
  }
  function strokeAbs(st, geo, proj) {
    let o = st.o || [0, 0];
    if (st.anc && geo.pos.has(st.anc)) o = projXY(geo.pos.get(st.anc), proj);
    return st.pts.map((v, k) => v + o[k & 1]);
  }

  // ============================== Exporty ==============================
  function dateGroups(s) {
    const groups = [];
    for (const sh of s.shots) {
      const dt = isoDate(sh.t || s.created);
      let g = groups[groups.length - 1];
      if (!g || g.date !== dt) groups.push(g = { date: dt, shots: [] });
      g.shots.push(sh);
    }
    return groups;
  }
  const cleanComment = c => String(c || '').replace(/[\r\n]+/g, ' ').trim();

  function toTherion(s) {
    const L = ['encoding  utf-8', '# ' + s.name + ' – export WebTopo ' + isoDate(Date.now())];
    if (s.comment) L.push('# ' + cleanComment(s.comment));
    if (s.fix && s.fix.st) {
      L.push('', 'centreline', '  fix ' + s.fix.st + ' ' + s.fix.x + ' ' + s.fix.y + ' ' + s.fix.z, 'endcentreline');
    }
    for (const g of dateGroups(s)) {
      L.push('', 'centreline', '  date ' + g.date.replace(/-/g, '.'));
      for (const p of String(s.team || '').split(/[,;]+/)) if (p.trim()) L.push('  team "' + p.trim().replace(/"/g, '') + '"');
      if (+s.decl) L.push('  declination ' + fmt(+s.decl, 2) + ' degrees');
      L.push('  data normal from to length compass clino');
      let ext = 0;
      for (const sh of g.shots) {
        if (sh.to) {
          const e = sh.ext >= 0 ? 1 : -1;
          if (e !== ext) { L.push('  extend ' + (e > 0 ? 'right' : 'left')); ext = e; }
        }
        const c = cleanComment(sh.c);
        L.push('  ' + sh.from + ' ' + (sh.to || '-') + ' ' + fmt(sh.d, 3) + ' ' + fmtAz(sh.a) + ' ' + fmt(sh.i, 2) + (c ? '  # ' + c : ''));
      }
      L.push('endcentreline');
    }
    return L.join('\n') + '\n';
  }

  // Rovnaký formát ako "Export Therion" z PocketTopo (xtherion ho vie importovať do .th aj .xvi).
  function toPocketTopo(s) {
    const geo = compute(s), L = [];
    if (s.fix && s.fix.st) L.push('FIX', [s.fix.st, fmt(+s.fix.x, 3), fmt(+s.fix.y, 3), fmt(+s.fix.z, 3)].join('\t'));
    for (const g of dateGroups(s)) {
      L.push('TRIP', 'DATE ' + g.date + ' ', 'DECLINATION     ' + fmt(+s.decl || 0, 2), 'DATA');
      for (const sh of g.shots) L.push([sh.from, sh.to || '', fmtAz(sh.a), fmt(sh.i, 2), fmt(sh.d, 3), sh.ext >= 0 ? '>' : '<'].join('\t'));
      L.push('');
    }
    for (const [title, proj, key] of [['PLAN', 'plan', 'p'], ['ELEVATION', 'elev', 'e']]) {
      L.push(title, 'STATIONS');
      for (const [n, P] of geo.pos) { const q = projXY(P, proj); L.push(fmt(q[0], 3) + '\t' + fmt(q[1], 3) + '\t' + n); }
      L.push('SHOTS');
      for (const sg of geo.segs) L.push(sg[key].map(v => fmt(v, 3)).join('\t'));
      for (const st of s.sketch[proj]) {
        const a = strokeAbs(st, geo, proj);
        L.push('POLYLINE ' + String(st.col || 'black').toUpperCase());
        for (let k = 0; k < a.length; k += 2) L.push(fmt(a[k], 3) + '\t' + fmt(a[k + 1], 3));
      }
    }
    return L.join('\r\n') + '\r\n';
  }

  function xviGrid(geo, s, proj) {
    let minX = 0, minY = 0, maxX = 0, maxY = 0, first = true;
    const see = (x, y) => {
      if (first) { minX = maxX = x; minY = maxY = y; first = false; return; }
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
    };
    for (const [, P] of geo.pos) { const q = projXY(P, proj); see(q[0], q[1]); }
    for (const sg of geo.segs) { const c = sg[proj === 'plan' ? 'p' : 'e']; see(c[0], c[1]); see(c[2], c[3]); }
    for (const st of s.sketch[proj]) { const a = strokeAbs(st, geo, proj); for (let k = 0; k < a.length; k += 2) see(a[k], a[k + 1]); }
    const x0 = Math.floor(minX) - 1, y0 = Math.floor(minY) - 1;
    const nx = Math.ceil(maxX) + 1 - x0, ny = Math.ceil(maxY) + 1 - y0;
    return { x0: x0 * XVI_K, y0: y0 * XVI_K, nx, ny, g: XVI_K };
  }
  function toXVI(s, proj) {
    const geo = compute(s), k = XVI_K, key = proj === 'plan' ? 'p' : 'e';
    const f = v => fmt(v * k, 2);
    const L = ['set XVIgrids {1.0 m}', 'set XVIstations {'];
    for (const [n, P] of geo.pos) { const q = projXY(P, proj); L.push('  {' + f(q[0]) + ' ' + f(q[1]) + ' ' + n + '}'); }
    L.push('}', 'set XVIshots {');
    for (const sg of geo.segs) L.push('  {' + sg[key].map(f).join(' ') + '}');
    L.push('}', 'set XVIsketchlines {');
    for (const st of s.sketch[proj]) {
      const a = strokeAbs(st, geo, proj);
      if (a.length < 4) continue;
      const pts = []; for (let j = 0; j < a.length; j += 2) pts.push(f(a[j]) + ' ' + f(a[j + 1]));
      L.push('  {' + (st.col || 'black') + '  ' + pts.join('  ') + '}');
    }
    const g = xviGrid(geo, s, proj);
    L.push('}', 'set XVIgrid {' + [fmt(g.x0, 2), fmt(g.y0, 2), fmt(g.g, 4), '0.0', '0.0', fmt(g.g, 4), g.nx, g.ny].join(' ') + '}');
    return L.join('\n') + '\n';
  }
  // .th2 so vloženým .xvi podkladom a bodmi staníc na správnych miestach (pre xtherion).
  function toTh2(s, proj, xviName, scrapName) {
    const geo = compute(s), k = XVI_K, g = xviGrid(geo, s, proj);
    const W = g.nx * g.g, H = g.ny * g.g;
    const L = ['encoding  utf-8',
      '##XTHERION## xth_me_area_adjust -128 -128 ' + fmt(W + 128, 2) + ' ' + fmt(H + 128, 2),
      '##XTHERION## xth_me_area_zoom_to 100'];
    const first = geo.pos.keys().next();
    if (!first.done) {
      const q = projXY(geo.pos.get(first.value), proj);
      L.push('##XTHERION## xth_me_image_insert {' + fmt(q[0] * k - g.x0, 2) + ' 1 1.0} {' + fmt(q[1] * k - g.y0, 2) + ' ' + first.value + '} ' + xviName + ' 0 {}');
    }
    // mierka v hlavičke: Therion ju pri scrape so stanicami nepotrebuje, PreTherion z nej berie mierku kresby
    const sc = ' -scale [0 0 ' + fmt(SCRAP_SCALE_M * k, 3) + ' 0 0 0 ' + SCRAP_SCALE_M + ' 0 m]';
    L.push('', '', 'scrap ' + scrapName + ' -projection ' + (proj === 'plan' ? 'plan' : 'extended') + sc);
    for (const [n, P] of geo.pos) {
      const q = projXY(P, proj);
      L.push('  point ' + fmt(q[0] * k - g.x0, 2) + ' ' + fmt(q[1] * k - g.y0, 2) + ' station -name ' + n);
    }
    L.push('endscrap', '');
    return L.join('\n');
  }

  function safeName(n) {
    return String(n || 'prieskum').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'prieskum';
  }
  function therionBundle(s) {
    const b = safeName(s.name);
    return [
      { name: b + '.th', text: toTherion(s) },
      { name: b + '_p.xvi', text: toXVI(s, 'plan') },
      { name: b + '_e.xvi', text: toXVI(s, 'elev') },
      { name: b + '_p.th2', text: toTh2(s, 'plan', b + '_p.xvi', b + '_p') },
      { name: b + '_e.th2', text: toTh2(s, 'elev', b + '_e.xvi', b + '_e') },
      { name: b + '_pockettopo.txt', text: toPocketTopo(s) },
      { name: b + '.webtopo.json', text: JSON.stringify(s) }
    ];
  }

  // ============================== Importy ==============================
  function fromPocketTopo(text, name) {
    const s = newSurvey(name || 'Import PocketTopo');
    const lines = String(text).split(/\r?\n/);

      try { await this.open(); } catch (e) { this.log('Pripojenie zlyhalo: ' + e.message); this.retry(); }
    }
    async svc(server, uuid) { try { return await server.getPrimaryService(uuid); } catch (e) { return null; } }
    async open() {
      if (this.stopped || this.opening) return;
      clearTimeout(this.rt);
      this.opening = true;
      try { await this.open2(); } finally { this.opening = false; }
    }
    async open2() {
      this.setState('connecting', 'Pripájam…');
      for (const s of this.subs || []) s.chr.removeEventListener('characteristicvaluechanged', s.h);
      this.subs = [];
      const server = await this.device.gatt.connect();
      let kind = this.type;
      if (kind === 'auto') {
        if (await this.svc(server, U.SAP6_SVC)) kind = 'sap6';
        else if (await this.svc(server, U.BRIC_MEAS)) kind = 'bric';
        else if (await this.svc(server, U.NUS_SVC)) kind = /^DistoX/i.test(this.name) ? 'distoxble' : 'sap5';
        else kind = 'sap5';
        this.log('Zistený protokol: ' + kind);
      }
      this.proto = kind;
      const on = (chr, fn) => {
        const h = e => {
          const dv = e.target.value;
          fn(new Uint8Array(dv.buffer.slice(dv.byteOffset, dv.byteOffset + dv.byteLength)));
        };
        chr.addEventListener('characteristicvaluechanged', h);
        this.subs.push({ chr, h });
        return chr.startNotifications();
      };
      if (kind === 'distoxble') {
        const s = await server.getPrimaryService(U.NUS_SVC);
        this.wr = await s.getCharacteristic(U.NUS_RX);
        await on(await s.getCharacteristic(U.NUS_TX), v => this.onDistoXBle(v));
      } else if (kind === 'sap5') {
        let s = await this.svc(server, U.NUS_SVC), rd = null;
        if (s) {
          const cs = await s.getCharacteristics();
          rd = cs.find(c => c.properties.notify || c.properties.indicate);
          this.wr = cs.find(c => c !== rd && (c.properties.write || c.properties.writeWithoutResponse)) || rd;
        } else {
          s = (await this.svc(server, U.CC254X_SVC)) || (await this.svc(server, U.RN4870_SVC));
          if (!s) throw new Error('Nenašla sa sériová BLE služba');
          rd = this.wr = await s.getCharacteristic(s.uuid === U.CC254X_SVC ? U.CC254X_CHR : U.RN4870_CHR);
        }
        this.stream = new WT.DistoXStream();
        await on(rd, v => this.onSap5(v));
      } else if (kind === 'sap6') {
        const s = await server.getPrimaryService(U.SAP6_SVC);
        this.wr = await s.getCharacteristic(U.SAP6_CMD);
        await on(await s.getCharacteristic(U.SAP6_LEG), v => this.onSap6(v));
      } else if (kind === 'bric') {
        const s = await server.getPrimaryService(U.BRIC_MEAS);
        this.pending = null;
        await on(await s.getCharacteristic(U.BRIC_PRIM), v => { const m = WT.decodeBricPrimary(v); this.log('← BRIC ' + WT.hex(v)); if (m) this.pending = m; });
        await on(await s.getCharacteristic(U.BRIC_META), v => { const m = WT.decodeBricMeta(v); if (m && this.pending) this.pending.idx = m.idx; });
        await on(await s.getCharacteristic(U.BRIC_ERR), v => this.onBricErr(v));
        const c = await this.svc(server, U.BRIC_CTRL);
        this.wr = c ? await c.getCharacteristic(U.BRIC_CTRL_CHR) : null;
      }
      this.log('Pripojené: ' + this.name + ' (' + kind + ')');
      this.setState('on', this.name);
    }
    write(chr, bytes) {
      if (!chr) return Promise.resolve();
      const data = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
      this.q = this.q.then(() => (chr.properties.write ? chr.writeValueWithResponse(data) : chr.writeValueWithoutResponse(data)))
        .catch(e => this.log('Chyba zápisu: ' + e.message));
      return this.q;
    }
    isDup(v) { const d = !!this.last && this.last.length === v.length && this.last.every((x, k) => x === v[k]); this.last = v; return d; }
    onDistoXBle(v) {
      const r = WT.decodeDistoXBle(v), dup = this.isDup(v);
      this.log('← ' + WT.hex(v) + (dup ? ' (opakovanie)' : ''));
      if (r.kind === 'other') return;
      this.write(this.wr, WT.distoxBleFrame([r.ack]));
      if (r.kind === 'shot' && !dup && r.msg.type === 'shot') this.emit(r.msg);
    }
    onSap5(v) {
      for (const r of this.stream.push(v)) {
        this.log('← ' + WT.hex(r.p) + ' ' + r.msg.type + (r.dup ? ' (opakovanie)' : ''));
        if (r.ack != null) this.write(this.wr, [r.ack]);
        if (r.msg.type === 'shot' && !r.dup) this.emit(r.msg);
      }
    }
    onSap6(v) {
      const m = WT.decodeSap6(v), dup = this.isDup(v);
      this.log('← ' + WT.hex(v) + (dup ? ' (opakovanie)' : ''));
      if (!m) return;
      this.write(this.wr, [m.ack]);
      if (!dup) this.emit(m);
    }
    onBricErr(v) {
      const e = WT.decodeBricErr(v), m = this.pending; this.pending = null;
      if (!m) return;
      if (e.e1 || e.e2) { this.log('BRIC chyba ' + e.e1 + '/' + e.e2); toast('BRIC: chybné meranie (kód ' + (e.e1 || e.e2) + ')', 'bad'); return; }
      const key = m.idx != null ? 'i' + m.idx : m.time + m.d;
      if (this.seen.has(key)) return;
      this.seen.add(key);
      this.emit(m);
    }
    async command(c) {
      if (this.state !== 'on') return false;
      if (this.proto === 'bric') { const t = WT.BRIC_CMD[c]; if (!t || !this.wr) return false; await this.write(this.wr, new TextEncoder().encode(t)); return true; }
      const b = (this.proto === 'sap6' ? WT.SAP6_CMD : WT.DISTOX_CMD)[c];
      if (b == null) return false;
      await this.write(this.wr, this.proto === 'distoxble' ? WT.distoxBleFrame([b]) : [b]);
      this.log('→ ' + c);
      return true;
    }
    onDisc() {
      this.log('Bluetooth odpojený');
      if (this.stopped) { this.setState('off', 'Odpojené'); return; }
      this.retry();
    }
    retry() {
      if (this.stopped) return;
      if (!S.autoRe) { this.setState('off', 'Odpojené'); return; }
      this.setState('wait', 'Čakám na prístroj…');
      clearTimeout(this.rt);
      this.rt = setTimeout(async () => { try { await this.open(); } catch (e) { this.log('Pokus zlyhal: ' + e.message); this.retry(); } }, 4000);
    }
    async disconnect() {
      this.stopped = true; clearTimeout(this.rt);
      try { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); } catch (e) { /* */ }
      this.setState('off', 'Odpojené');
    }
  }

  class SimDev extends BaseDev {
    async connect() { this.sim = new WT.Simulator((Date.now() & 0xffff) + 1); this.name = 'Simulátor'; this.setState('on', 'Simulátor'); }
    async command(c) { if (c === 'shot') setTimeout(() => this.emit(this.sim.next()), 200); return true; }
    auto(on) { clearInterval(this.ti); if (on) this.ti = setInterval(() => this.command('shot'), 1500); }
    async disconnect() { this.auto(false); this.stopped = true; this.setState('off', 'Odpojené'); }
  }

  function makeDev(type) {
    const api = DEV_TYPES[type].api;
    if (api === 'serial') return new SerialDistoX(type);
    if (api === 'ble') return new BleDev(type);
    return new SimDev(type);
  }
  function devLog(t) {
    const d = new Date();
    devLogLines.push(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0') + '  ' + t);
    if (devLogLines.length > 200) devLogLines.splice(0, devLogLines.length - 200);
    const el = document.getElementById('devLog');
    if (el) { el.textContent = devLogLines.slice(-60).join('\n'); el.scrollTop = el.scrollHeight; }
  }

  // ============================== merania ==============================
  function onMeasurement(m) {
    if (!sv) return;
    const r = WT.addMeasurement(sv, m, { tolD: S.tolD, tolA: S.tolA, legShots: S.legShots });
    flashId = r.shot.id;
    if (r.kind === 'leg') {
      beep([880, 1320]); vib([70, 60, 70]);
      toast('Ťah ' + r.shot.from + ' → ' + r.shot.to + ' · ' + WT.fmt(r.shot.d, 2) + ' m', 'ok');
    } else if (r.kind === 'legplus') {
      beep([1320]); vib(40);
      toast('Ťah ' + r.shot.from + ' → ' + r.shot.to + ' spresnený (' + r.shot.raw.length + ' merania)', 'ok');
    } else {
      beep([880]); vib(35);
      toast('Zámer z ' + r.shot.from + ' · ' + WT.fmt(r.shot.d, 2) + ' m');
    }
    changed(true);
    if (r.kind === 'leg') for (const v of [planView, elevView]) v.follow();
    scrollTableEnd();
    if (navigator.storage && navigator.storage.persist && !persistAsked) { persistAsked = true; navigator.storage.persist().catch(() => {}); }
  }
  async function doShot() {
    if (dev && dev.state === 'on') {
      const ok = await dev.command('shot').catch(() => false);
      if (!ok) toast('Prístroj nepodporuje meranie na diaľku – stlač tlačidlo na prístroji');
    } else manualDialog();
  }

  // ============================== vykreslenie ==============================
  function renderAll() { renderHeader(); renderTable(); planView.requestRender(); elevView.requestRender(); }
  function renderHeader() {

      : (S.legShots ? S.legShots + ' zhodné merania<br>= ťah' : 'ťahy sa zadávajú<br>ručne');

  function renderDev() {

  }
  function rowHTML(sh) {
    const leg = !!sh.to;
    const cls = (leg ? 'leg' : 'splay') + (sh.id === flashId ? ' new' : '') + ((sh.to || sh.from) === sv.cur && leg ? ' cur' : '');
    return '<tr class="' + cls + '" data-id="' + sh.id + '"><td class="st">' + esc(sh.from) + '</td><td class="st">' + (leg ? esc(sh.to) : '–') +
      (sh.c ? '<span class="cm">✎</span>' : '') + '</td><td>' + WT.fmt(sh.d, 2) + '</td><td>' + WT.fmt(+WT.fmtAz(sh.a), 1) + '</td><td>' + WT.fmt(sh.i, 1) +
      '</td><td class="ex">' + (leg ? (sh.ext >= 0 ? '›' : '‹') : '') + '</td></tr>';
  }
  function renderTable() {
    const shots = S.hideSplays ? sv.shots.filter(x => x.to) : sv.shots;
    $('#tbody').innerHTML = shots.map(rowHTML).join('');
    $('#empty').style.display = sv.shots.length ? 'none' : '';
    document.body.dataset.font = S.font;
  }
  function scrollTableEnd() { const w = $('#tblWrap'); requestAnimationFrame(() => { w.scrollTop = w.scrollHeight; }); }

  // ---------------- náčrt ----------------
  class SketchView {
    constructor(canvas, proj) {
      this.cv = canvas; this.ctx = canvas.getContext('2d'); this.proj = proj;
      this.v = null; this.ptrs = new Map(); this.tool = 'pen'; this.col = 'black';
      this.stroke = null; this.undo = []; this.raf = 0; this.W = 1; this.H = 1;
      canvas.addEventListener('pointerdown', e => this.down(e));
      canvas.addEventListener('pointermove', e => this.move(e));
      canvas.addEventListener('pointerup', e => this.up(e));
      canvas.addEventListener('pointercancel', e => this.up(e, true));
      canvas.addEventListener('wheel', e => { e.preventDefault(); this.zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
      new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
    }
    visible() { return curView === (this.proj === 'plan' ? 'vPlan' : 'vElev'); }
    resize() {
      const r = this.cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (r.width < 2 || r.height < 2) return;
      this.W = r.width; this.H = r.height; this.dpr = dpr;
      this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
      this.cv.style.width = r.width + 'px'; this.cv.style.height = r.height + 'px';
      if (!this.v) this.fit();
      this.render();
    }
    xy(P) { return WT.projXY(P, this.proj); }
    sx(x) { return this.W / 2 + (x - this.v.cx) * this.v.s; }
    sy(y) { return this.H / 2 - (y - this.v.cy) * this.v.s; }
    toModel(px, py) { return [this.v.cx + (px - this.W / 2) / this.v.s, this.v.cy - (py - this.H / 2) / this.v.s]; }
    fit() {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const see = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
      if (geo) {
        for (const [, P] of geo.pos) { const q = this.xy(P); see(q[0], q[1]); }
        for (const sg of geo.segs) { const c = sg[this.proj === 'plan' ? 'p' : 'e']; see(c[2], c[3]); }
        for (const st of sv.sketch[this.proj]) { const a = WT.strokeAbs(st, geo, this.proj); for (let k = 0; k < a.length; k += 2) see(a[k], a[k + 1]); }
      }
      if (!isFinite(x0)) { x0 = y0 = -5; x1 = y1 = 5; }
      const w = Math.max(x1 - x0, 4), h = Math.max(y1 - y0, 4);
      const s = Math.min((this.W - 40) / w, (this.H - 40) / h);
      this.v = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s: Math.max(2, Math.min(400, s)) };
      this.requestRender();
    }
    center() {
      const P = geo && geo.pos.get(sv.cur);
      if (!P) return this.fit();
      const q = this.xy(P); this.v.cx = q[0]; this.v.cy = q[1]; this.requestRender();
    }
    follow() {
      if (!this.v || !geo) return;
      const P = geo.pos.get(sv.cur); if (!P) return;
      const q = this.xy(P), x = this.sx(q[0]), y = this.sy(q[1]), m = 50;
      if (x < m || y < m || x > this.W - m || y > this.H - m) { this.v.cx = q[0]; this.v.cy = q[1]; }
      this.requestRender();
    }
    zoomAt(px, py, f) {
      const before = this.toModel(px, py);
      this.v.s = Math.max(0.5, Math.min(800, this.v.s * f));
      const after = this.toModel(px, py);
      this.v.cx += before[0] - after[0]; this.v.cy += before[1] - after[1];
      this.requestRender();
    }
    requestRender() { if (this.raf || !this.visible()) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.render(); }); }
    render() {
      if (!this.v || !this.visible()) return;
      const c = this.ctx, dpr = this.dpr || 1, W = this.W, H = this.H, s = this.v.s;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = '#fbfaf5'; c.fillRect(0, 0, W, H);
      // mriežka
      const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
      const g = steps.find(x => x * s >= 32) || 1000;
      const [mx0, my1] = this.toModel(0, 0), [mx1, my0] = this.toModel(W, H);
      c.lineWidth = 1; c.strokeStyle = '#e6e1d3'; c.beginPath();
      for (let x = Math.floor(mx0 / g) * g; x <= mx1; x += g) { const X = Math.round(this.sx(x)) + 0.5; c.moveTo(X, 0); c.lineTo(X, H); }
      for (let y = Math.floor(my0 / g) * g; y <= my1; y += g) { const Y = Math.round(this.sy(y)) + 0.5; c.moveTo(0, Y); c.lineTo(W, Y); }
      c.stroke();
      if (!geo) return;
      const key = this.proj === 'plan' ? 'p' : 'e';
      // zámery
      if (S.sketchSplays) {
        c.strokeStyle = '#9fb0bc'; c.lineWidth = 1; c.beginPath();
        for (const sg of geo.segs) if (sg.kind === 'splay') { const q = sg[key]; c.moveTo(this.sx(q[0]), this.sy(q[1])); c.lineTo(this.sx(q[2]), this.sy(q[3])); }
        c.stroke();
      }
      // náčrt
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (const st of sv.sketch[this.proj]) this.drawStroke(WT.strokeAbs(st, geo, this.proj), st.col, st.w);
      if (this.stroke) this.drawStroke(this.stroke.pts, this.col, S.pen);
      // ťahy
      c.strokeStyle = '#b3261e'; c.lineWidth = 2.2; c.beginPath();
      for (const sg of geo.segs) if (sg.kind === 'leg') { const q = sg[key]; c.moveTo(this.sx(q[0]), this.sy(q[1])); c.lineTo(this.sx(q[2]), this.sy(q[3])); }
      c.stroke();
      // stanice
      const showLabels = S.labels && s >= 6;
      c.font = '600 12px system-ui, sans-serif'; c.textBaseline = 'middle';
      for (const [name, P] of geo.pos) {
        const q = this.xy(P), X = this.sx(q[0]), Y = this.sy(q[1]);
        if (X < -40 || Y < -40 || X > W + 40 || Y > H + 40) continue;
        const isCur = name === sv.cur;
        c.fillStyle = isCur ? '#0277bd' : '#b3261e';
        c.beginPath(); c.arc(X, Y, isCur ? 4.5 : 3, 0, Math.PI * 2); c.fill();
        if (isCur) { c.strokeStyle = '#0277bd'; c.lineWidth = 2; c.beginPath(); c.arc(X, Y, 10, 0, Math.PI * 2); c.stroke(); }
        if (showLabels || isCur) {
          c.lineWidth = 3; c.strokeStyle = 'rgba(251,250,245,.9)'; c.strokeText(name, X + 7, Y - 9);
          c.fillStyle = isCur ? '#01579b' : '#5d4037'; c.fillText(name, X + 7, Y - 9);
        }
      }
      if (!geo.pos.size) {
        c.fillStyle = '#7b8a97'; c.font = '14px system-ui, sans-serif'; c.textAlign = 'center';
        c.fillText('Zatiaľ žiadne merania', W / 2, H / 2); c.textAlign = 'left';
      }
      // mierka a sever
      const bar = steps.find(x => x * s >= 60) || 1000, bw = bar * s;
      c.fillStyle = '#37474f'; c.fillRect(12, H - 18, bw, 4);
      c.font = '12px system-ui, sans-serif'; c.fillText(bar + ' m', 12, H - 28);
      if (this.proj === 'plan') {
        c.save(); c.translate(W - 26, 34); c.fillStyle = '#37474f';
        c.beginPath(); c.moveTo(0, -16); c.lineTo(7, 8); c.lineTo(0, 3); c.lineTo(-7, 8); c.closePath(); c.fill();
        c.font = '700 11px system-ui, sans-serif'; c.textAlign = 'center'; c.fillText('S', 0, 20); c.restore(); c.textAlign = 'left';
      } else {
        c.fillStyle = '#607d8b'; c.font = '11px system-ui, sans-serif'; c.fillText('rozvinutý rez', W - 88, 18);
      }
    }
    drawStroke(a, col, w) {
      const c = this.ctx;
      c.strokeStyle = c.fillStyle = PEN[col] || '#141414';
      c.lineWidth = (w || 2) * Math.max(0.6, Math.min(2.5, this.v.s / 40));
      if (a.length === 2) { c.beginPath(); c.arc(this.sx(a[0]), this.sy(a[1]), c.lineWidth * 0.9, 0, Math.PI * 2); c.fill(); return; }
      c.beginPath(); c.moveTo(this.sx(a[0]), this.sy(a[1]));
      for (let k = 2; k < a.length; k += 2) c.lineTo(this.sx(a[k]), this.sy(a[k + 1]));
      c.stroke();
    }
    pt(e) { const r = this.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    down(e) {
      e.preventDefault();
      this.cv.setPointerCapture(e.pointerId);
      const p = this.pt(e);
      this.ptrs.set(e.pointerId, p);
      if (this.ptrs.size === 1) {
        this.tap = { x: p.x, y: p.y, t: performance.now(), moved: false };
        this.blocked = false;
        if (this.tool === 'pen') this.stroke = { pts: this.toModel(p.x, p.y), last: p, t: performance.now(), len: 0 };
        else if (this.tool === 'erase') { this.eraseSnap = sv.sketch[this.proj].slice(); this.eraseAt(p); }
        this.panLast = p;
      } else if (this.ptrs.size === 2) {
        if (this.stroke) { if (this.stroke.len > 60 && performance.now() - this.stroke.t > 400) this.commitStroke(); this.stroke = null; }
        const [a, b] = [...this.ptrs.values()];
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
        this.blocked = true;
        this.requestRender();
      }
    }
    move(e) {
      if (!this.ptrs.has(e.pointerId)) return;
      const p = this.pt(e), prev = this.ptrs.get(e.pointerId);
      this.ptrs.set(e.pointerId, p);
      if (this.tap && Math.hypot(p.x - this.tap.x, p.y - this.tap.y) > 8) this.tap.moved = true;
      if (this.ptrs.size >= 2 && this.pinch) {
        const [a, b] = [...this.ptrs.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        this.v.cx -= (m.x - this.pinch.m.x) / this.v.s; this.v.cy += (m.y - this.pinch.m.y) / this.v.s;
        this.zoomAt(m.x, m.y, d / this.pinch.d);
        this.pinch = { d, m };
        return;
      }
      if (this.blocked) return;
      if (this.tool === 'pen' && this.stroke) {
        const st = this.stroke, dd = Math.hypot(p.x - st.last.x, p.y - st.last.y);
        if (dd < 2.5) return;
        const q = this.toModel(p.x, p.y);
        st.pts.push(q[0], q[1]); st.len += dd;
        const c = this.ctx; c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        c.strokeStyle = PEN[this.col]; c.lineCap = 'round';
        c.lineWidth = S.pen * Math.max(0.6, Math.min(2.5, this.v.s / 40));
        c.beginPath(); c.moveTo(st.last.x, st.last.y); c.lineTo(p.x, p.y); c.stroke();
        st.last = p;
      } else if (this.tool === 'erase') this.eraseAt(p);
      else { this.v.cx -= (p.x - prev.x) / this.v.s; this.v.cy += (p.y - prev.y) / this.v.s; this.requestRender(); }
    }
    up(e, cancel) {
      if (!this.ptrs.has(e.pointerId)) return;
      this.ptrs.delete(e.pointerId);
      if (this.ptrs.size < 2) this.pinch = null;
      if (this.ptrs.size) return;
      const tap = !cancel && this.tap && !this.tap.moved && !this.blocked && performance.now() - this.tap.t < 350;
      const hit = tap && this.tool !== 'erase' ? this.stationAt(this.tap) : null;
      if (hit) this.stroke = null;
      else if (this.stroke && !cancel && !this.blocked) this.commitStroke();
      this.stroke = null;
      if (this.tool === 'erase' && this.eraseSnap) {
        if (this.eraseSnap.length !== sv.sketch[this.proj].length) { this.pushUndo(this.eraseSnap); changed(); }
        this.eraseSnap = null;
      }
      this.tap = null; this.blocked = false;
      this.requestRender();
      if (hit) stationMenu(hit);
    }
    commitStroke() {
      const st = this.stroke; if (!st || st.pts.length < 2) return;
      if (st.pts.length === 2 && performance.now() - st.t < 120) return; // náhodný dotyk
      this.pushUndo(sv.sketch[this.proj].slice());
      sv.sketch[this.proj].push(WT.makeStroke(st.pts.map(v => +v.toFixed(3)), this.col, geo, this.proj, S.pen !== 2 ? S.pen : undefined));
      this.stroke = null;
      changed();
    }
    pushUndo(snap) { this.undo.push(snap); if (this.undo.length > 60) this.undo.shift(); }
    doUndo() {
      if (!this.undo.length) { toast('Nie je čo vrátiť'); return; }
      sv.sketch[this.proj] = this.undo.pop(); changed();
    }
    eraseAt(p) {
      const list = sv.sketch[this.proj], r = 14;
      const keep = list.filter(st => {
        const a = WT.strokeAbs(st, geo, this.proj);
        for (let k = 0; k < a.length; k += 2) {
          const x1 = this.sx(a[k]), y1 = this.sy(a[k + 1]);
          if (k + 2 >= a.length) { if (Math.hypot(p.x - x1, p.y - y1) < r) return false; continue; }
          const x2 = this.sx(a[k + 2]), y2 = this.sy(a[k + 3]);
          const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
          const t = L ? Math.max(0, Math.min(1, ((p.x - x1) * dx + (p.y - y1) * dy) / L)) : 0;
          if (Math.hypot(p.x - (x1 + t * dx), p.y - (y1 + t * dy)) < r) return false;
        }
        return true;
      });
      if (keep.length !== list.length) { sv.sketch[this.proj] = keep; this.requestRender(); }
    }
    stationAt(p) {
      if (!geo) return null;
      let best = null, bd = 26;
      for (const [name, P] of geo.pos) { const q = this.xy(P), d = Math.hypot(this.sx(q[0]) - p.x, this.sy(q[1]) - p.y); if (d < bd) { bd = d; best = name; } }
      return best;
    }
  }

      btn('ren', 'Premenovať', name) + '</div>' +
      '<div class="mgrid r4">' +
      btn('l1', '‹ Rozvinúť', 'vľavo', { dis: !leg, on: ext < 0 }) +
      btn('r1', 'Rozvinúť ›', 'vpravo', { dis: !leg, on: ext > 0 }) +

    m.el.querySelector('.sh-b').addEventListener('click', e => {
      const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;

    const leg = !!sh.to;
    const title = (leg ? sh.from + ' → ' + sh.to : 'Zámer z ' + sh.from) + '   ' + WT.fmt(sh.d, 2) + ' m · ' + WT.fmt(+WT.fmtAz(sh.a), 1) + '° · ' + WT.fmt(sh.i, 1) + '°';
    const b = [];
    b.push({ label: 'Upraviť…', cls: 'pri', onClick: () => { editDialog(sh); } });
    if (leg) {
      b.push({ label: 'Rez: ' + (sh.ext >= 0 ? '› doprava → zmeniť na ‹ doľava' : '‹ doľava → zmeniť na › doprava'), onClick: () => { WT.toggleExt(sv, sh.id); changed(); } });
      b.push({ label: 'Otočiť smer (spätný zámer)', onClick: () => { WT.reverseShot(sv, sh.id); changed(); toast('Teraz ' + sh.from + ' → ' + sh.to); } });
      if (sh.raw && sh.raw.length > 1) b.push({ label: 'Rozdeliť na ' + sh.raw.length + ' zámery', onClick: () => { WT.splitLeg(sv, sh.id); changed(); } });
      b.push({ label: 'Pokračovať z ' + sh.to, onClick: () => { WT.setCurrent(sv, sh.to); changed(); } });
      b.push({ label: 'Pokračovať z ' + sh.from, onClick: () => { WT.setCurrent(sv, sh.from); changed(); } });
    } else {
      const to = sh.from === sv.cur ? sv.next : WT.suggestNext(sv, sh.from);
      b.push({ label: 'Spraviť z neho ťah ' + sh.from + ' → ' + to, onClick: () => { WT.makeLeg(sv, sh.id, to); changed(); } });
      b.push({ label: 'Pokračovať z ' + sh.from, onClick: () => { WT.setCurrent(sv, sh.from); changed(); } });
    }
    b.push({ label: 'Vymazať', cls: 'bad', onClick: async () => { if (await confirmBox('Vymazať toto meranie?', 'Vymazať')) { WT.deleteShot(sv, sh.id); changed(); } } });
    const m = modal(title, '', b);
    m.el.querySelector('.sh-f').classList.add('vert');
    if (sh.c) m.el.querySelector('.sh-b').innerHTML = '<p>✎ ' + esc(sh.c) + '</p>';
  }

  function readForm(el) {
    const v = { from: el.querySelector('#fFrom').value.trim(), to: el.querySelector('#fTo').value.trim(),
      d: num(el.querySelector('#fD').value), a: num(el.querySelector('#fA').value), i: num(el.querySelector('#fI').value),
      ext: +el.querySelector('#fE').value, c: el.querySelector('#fC').value.trim() };
    if (!validName(v.from) || (v.to && !validName(v.to))) throw new Error('Názov stanice: len písmená bez diakritiky, číslice, bodka, - a _');
    if (v.to === v.from) throw new Error('Od a Do musia byť rôzne');
    if (!(v.d >= 0) || !(v.a >= 0 && v.a <= 360) || !(v.i >= -90 && v.i <= 90)) throw new Error('Skontroluj hodnoty: dĺžka ≥ 0, azimut 0–360°, sklon −90 až 90°');
    v.a = WT.norm360(v.a);
    return v;
  }
  function editDialog(sh) {
    const m = modal('Upraviť meranie', shotForm(sh, false), [
      { label: 'Zrušiť' },
      { label: 'Uložiť', cls: 'pri', onClick: el => {
        const v = readForm(el);
        const wasLeg = !!sh.to, old = { from: sh.from, to: sh.to };
        Object.assign(sh, v);
        const used = n => sv.shots.some(x => x.from === n || x.to === n);
        if (!wasLeg && sh.to && sh.from === sv.cur) WT.setCurrent(sv, sh.to);
        else if (old.to && sv.cur === old.to && !used(old.to)) WT.setCurrent(sv, sh.to || sh.from);
        else if (sv.cur === old.from && !used(old.from)) WT.setCurrent(sv, sh.from);
        else if (sv.next === sv.cur || used(sv.next) && sv.next === old.to) sv.next = WT.suggestNext(sv, sv.cur);
        changed();
      } }
    ]);
    m.el.querySelector('#fE').value = String(sh.ext >= 0 ? 1 : -1);
  }
  function manualDialog() {
    const sh = { from: sv.cur, to: sv.next, d: 0, a: 0, i: 0, ext: sv.ext, c: '' };
    const m = modal('Ručné meranie', shotForm(sh, true), [
      { label: 'Zrušiť' },
      { label: 'Pridať', cls: 'pri', onClick: el => {
        const v = readForm(el);

  }

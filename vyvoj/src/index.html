<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17212b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>WebTopo</title>
<style>
:root{--bg:#0f1720;--panel:#17212b;--panel2:#1e2a36;--line:#2a3846;--text:#e9eef2;--muted:#8fa0ae;--acc:#4fc3f7;--pri:#0288d1;--ok:#66bb6a;--warn:#ffb74d;--bad:#e57373;--leg:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));padding-top:calc(6px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.ico{width:38px;height:38px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center}
.ico:active{background:var(--panel2)}
#title{flex:1;min-width:0}
#svName{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#svStats{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:7px;max-width:46vw;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600}
.pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:9px;height:9px;border-radius:50%;background:#607d8b;flex:none}
.pill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.connecting .dot,.pill.wait .dot{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#stBar{display:flex;align-items:center;gap:8px;padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
#stChip{display:flex;align-items:center;gap:8px;border:1px solid #2f6d8f;background:#123047;border-radius:10px;padding:7px 12px;font-size:15px}
#stChip b{font-size:17px;color:#b3e5fc}
#stChip .arr{color:var(--muted)}
#stExt{font-weight:800;color:var(--warn);font-size:18px}
#stHint{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
#stBar .ico{flex:none}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
#tblWrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th.st{text-align:left}
td{padding:10px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td.st{text-align:left;font-weight:600}
td.ex{color:var(--warn);font-weight:800;width:22px;text-align:center}
th.mn,td.mn{width:24px;padding:0 0 0 4px;text-align:center;color:var(--muted)}
td.mn svg{width:16px;height:16px;vertical-align:middle}
#tbody td{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
td.editing{padding:3px 4px}
input.cell{display:inline-block;width:4.6em;margin:0;padding:6px;font:inherit;text-align:right;border:1px solid var(--acc);border-radius:6px;background:#0b1520;color:var(--text)}
td.st input.cell{width:4.2em;text-align:left}
tr.entry td{padding:5px 3px;border-bottom:0;background:#132230}
tr.entry input{width:100%;min-width:3.4em;margin:0;padding:7px 5px;font:inherit;text-align:right;border:1px dashed #36506a;border-radius:6px;background:transparent;color:var(--text)}
tr.entry #enTo{text-align:left}
tr.entry input:focus{border-style:solid;border-color:var(--acc);outline:none}
tr.entry .add{width:24px;height:30px;border:0;border-radius:6px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;padding:0}
#enFrom{color:#b3e5fc;cursor:pointer}#enExt{cursor:pointer}
tr.splay td{color:var(--muted);font-weight:400}
tr.leg td{color:var(--leg)}
tr.leg td:nth-child(3),tr.leg td:nth-child(4),tr.leg td:nth-child(5){font-weight:600}
tr.cur td.st{color:#b3e5fc}
tr.sel td{background:rgba(79,195,247,.13)}
tr.msel td{background:rgba(255,183,77,.18)}
tr.msel td.mn{box-shadow:inset 3px 0 0 var(--warn);color:var(--warn)}
#mbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--warn);box-shadow:0 6px 20px #000a}
#mbar[hidden]{display:none}#mCount{flex:1;font-weight:650;padding-left:4px}
#tblWrap.mpad{padding-bottom:70px}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tr.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#2e7d32}100%{background:transparent}}
tr:active{background:var(--panel2)}
.cm{color:var(--warn);margin-left:4px;font-size:12px}
body[data-font=s] td{padding:7px 5px;font-size:13px}
body[data-font=l] td{padding:12px 6px;font-size:18px}
#empty{padding:28px 20px;color:var(--muted);text-align:center}
#empty .btn{margin:6px}
canvas{display:block;touch-action:none;background:#fbfaf5}
#tools{display:none;position:relative;z-index:5;gap:4px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);justify-content:space-between}
body.sketching #tools{display:flex}
.tb{flex:0 1 38px;min-width:32px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--text)}
.tb.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.tb.col i{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid #fff4}
.tb.pen{position:relative}
.tb.pen span{position:absolute;right:3px;top:1px;font-size:9px;color:var(--muted)}
#palette{position:absolute;left:8px;bottom:100%;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #000a}
#palette[hidden]{display:none}
#palette{flex-wrap:nowrap}#palette .tb{flex:none;width:38px}
/* na šírku (telefón): spodné panely ako zvislé stĺpce na fyzickom spodku telefónu */
body.land #app{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:auto auto minmax(0,1fr)}
body.land #top,body.land #stBar{grid-column:1/-1}
body.land main{grid-row:3;grid-column:1;margin-left:env(safe-area-inset-left)}
body.land #tools{grid-row:3;grid-column:2;border-top:0;border-left:1px solid var(--line);padding:6px}
body.land.sketching #tools{display:grid;grid-template-columns:repeat(2,38px);grid-auto-rows:38px;gap:4px;align-content:start}
body.land #tools .tb{width:38px}
body.land #tabs{grid-row:3;grid-column:3;flex-direction:column;justify-content:flex-start;border-top:0;border-left:1px solid var(--line);padding:6px;padding-right:max(6px,env(safe-area-inset-right))}
body.land #tabs [data-v]{flex:0 0 auto;width:46px;height:46px}
body.land #palette{display:grid;grid-template-columns:repeat(2,38px);left:auto;right:100%;bottom:auto;top:6px;margin:0 6px 0 0}
body.land #palette[hidden]{display:none}
body.land-l #app{grid-template-columns:auto auto minmax(0,1fr)}
body.land-l main{grid-column:3;margin-left:0;margin-right:env(safe-area-inset-right)}
body.land-l #tabs{grid-column:1;border-left:0;border-right:1px solid var(--line);padding-right:6px;padding-left:max(6px,env(safe-area-inset-left))}
body.land-l #tools{grid-column:2;border-left:0;border-right:1px solid var(--line)}
body.land-l #palette{right:auto;left:100%;margin:0 0 0 6px}
#stHint b{color:var(--text);font-weight:600}
#stHint small{font-size:11px}
#tabs{display:flex;gap:6px;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#tabs [data-v]{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center}
#tabs [data-v] svg{width:21px;height:21px}
#tabs [data-v].on{background:var(--panel2);color:var(--text);border-color:#3b5163}
#btnUndoData{border:1px solid var(--line);background:var(--panel2)}
#btnUndoData:disabled{opacity:.35}
body.sketching #btnUndoData{display:none}
body.sketching #top,body.sketching #stBar{display:none}
#toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%,-12px);max-width:92vw;padding:10px 16px;border-radius:12px;background:#263238;color:#fff;font-weight:600;box-shadow:0 6px 24px #0008;opacity:0;pointer-events:none;transition:.2s;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#2e7d32}#toast.bad{background:#c62828}
.modal{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 8px);display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .16s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-h .ttl{flex:1;min-width:0}.sh-h b{display:block;font-size:16px}.sh-h small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.x{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:16px}
.sh-b{padding:12px 14px;overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.sh-h,.sh-f{flex:none}
.compact .sh-h{padding:9px 12px}.compact .sh-b{padding:8px 10px 12px}
.mgrid{display:grid;gap:6px}.mgrid.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.mgrid.r4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px}
.mbtn{min-height:44px;padding:5px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);line-height:1.15;text-align:center}
.mbtn b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.mbtn.bad b{color:#ffcdd2}.mbtn.bad{border-color:#6d2a2a;background:#3a1d1d}
.mgrid.r3+.mgrid.r3,.mgrid.r4+.mgrid.r3{margin-top:6px}.mbtn:disabled{opacity:.35}.mbtn:active{filter:brightness(1.25)}
.sh-b:empty{display:none}
.sh-f{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px;justify-content:flex-end}
.sh-f.vert{flex-direction:column}
.sh-f.vert .btn{width:100%;text-align:left}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:active{filter:brightness(1.25)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.bad{color:#ffcdd2;border-color:#6d2a2a;background:#3a1d1d}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
label{display:block;margin:8px 0;font-size:13px;color:var(--muted)}
label small{font-size:11px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0f1923;color:var(--text);font:16px system-ui,sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
label.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
label.check input{width:22px;height:22px;margin:0}
.radios{display:flex;flex-direction:column;gap:6px}
label.radio{display:flex;gap:10px;align-items:center;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px}
label.radio input{width:20px;height:20px;margin:0;flex:none}
label.radio small{display:block;color:var(--muted);font-size:12px}
label.radio.dis{opacity:.45}
.caps{display:flex;gap:8px;margin-bottom:6px;font-size:12px}
.caps span{padding:3px 8px;border-radius:6px;background:var(--panel2)}
.caps .y{color:var(--ok)}.caps .n{color:var(--bad)}
.state{margin:4px 0 10px;font-weight:600}
.note{font-size:13px;color:var(--warn);margin:8px 0}
.row{display:flex;flex-wrap:wrap}.gap{gap:6px;margin:8px 0}
.log{max-height:180px;overflow:auto;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#0b1118;padding:8px;border-radius:8px;white-space:pre-wrap;color:#b0bec5}
details summary{cursor:pointer;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:8px 12px;border-radius:16px;border:1px solid #2f6d8f;background:#123047;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.svrow,.exrow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.svrow.on{background:#123047;border-radius:8px}
.svrow .t,.exrow .t{flex:1;min-width:0}
.svrow small,.exrow small{display:block;color:var(--muted);font-size:12px}
.help p{margin:0 0 10px;font-size:14px}
</style>
</head>
<body data-font="m">
<div id="app">
  <header id="top">
    <button id="btnMenu" class="ico" aria-label="Menu"></button>
    <div id="title"><div id="svName">WebTopo</div><div id="svStats"></div></div>
    <button id="devPill" class="pill off"><span class="dot"></span><span id="devName">Pripojiť</span></button>
  </header>
  <div id="stBar">
    <button id="stChip">Od <b id="stCur">1.0</b><span class="arr">→</span><b id="stNext">1.1</b><span id="stExt">›</span></button>
    <button id="btnUndoData" class="ico" title="Krok späť" aria-label="Krok späť" disabled></button>
    <div id="stHint">3 zhodné merania<br>= ťah</div>
  </div>
  <main>
    <section id="vData" class="view active">
      <div id="tblWrap">
        <table><thead><tr><th class="mn"></th><th class="st">Od</th><th class="st">Do</th><th>Dĺžka</th><th>Azimut</th><th>Sklon</th><th></th></tr></thead><tbody id="tbody"></tbody>
        <tbody id="tentry"><tr class="entry"><td class="mn"><button id="enAdd" class="add" aria-label="Pridať meranie">+</button></td><td class="st" id="enFrom" title="Aktuálna stanica"></td><td><input id="enTo" placeholder="–" autocomplete="off" autocapitalize="off" enterkeyhint="next" aria-label="Do"></td><td><input id="enD" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-label="Dĺžka"></td><td><input id="enA" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-label="Azimut"></td><td><input id="enI" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Sklon"></td><td class="ex" id="enExt" title="Smer nového ťahu v reze"></td></tr></tbody></table>
        <div id="empty"><p>Zatiaľ žiadne merania. Pripoj prístroj alebo zapíš meranie do posledného riadku.</p><button class="btn pri" id="emptyDev">Pripojiť prístroj</button></div>
      </div>
      <div id="mbar" hidden><span id="mCount"></span><button class="btn sm pri" id="mLeg">Ťah z označených</button><button class="btn sm bad" id="mDel">Vymazať</button><button class="btn sm" id="mX" aria-label="Zrušiť označenie">✕</button></div>
    </section>
    <section id="vPlan" class="view"><canvas id="cvPlan"></canvas></section>
    <section id="vElev" class="view"><canvas id="cvElev"></canvas></section>
  </main>
  <div id="tools"></div>
  <nav id="tabs">
    <button data-v="vData" class="on" title="Dáta" aria-label="Dáta"></button>
    <button data-v="vPlan" title="Pôdorys" aria-label="Pôdorys"></button>
    <button data-v="vElev" title="Rozvinutý rez" aria-label="Rozvinutý rez"></button>
  </nav>
</div>
<div id="toast"></div>
<!--CORE--><script src="core.js"></script>
<!--APP--><script src="app.js"></script>
</body>
</html>
